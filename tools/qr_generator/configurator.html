<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Designer</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#202124;background:#f6f5f2}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:minmax(340px,440px) 1fr;min-height:100vh}.controls{padding:22px;background:#fff;border-right:1px solid #ddd;overflow:auto}.preview{display:flex;align-items:center;justify-content:center;padding:28px;position:sticky;top:0;height:100vh}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0001;max-width:680px;width:100%}#qr{display:flex;justify-content:center;align-items:center;min-height:480px}#qr svg{width:min(70vh,580px);height:auto;max-width:100%}h1{font-size:24px;margin:0 0 6px}h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin:24px 0 10px;color:#686868}.sub,.tiny{color:#777;font-size:12px}.sub{margin-bottom:20px}label{display:block;font-size:12px;font-weight:700;margin:11px 0 5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button{font:inherit}input[type=text],input[type=url],input[type=number],select{width:100%;padding:9px 10px;border:1px solid #ccc;border-radius:9px;background:white}input[type=color]{width:100%;height:39px;border:1px solid #ccc;border-radius:9px;background:white;padding:3px}.range{display:grid;grid-template-columns:1fr 58px;gap:8px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}button{border:0;border-radius:9px;padding:9px 12px;background:#222;color:#fff;cursor:pointer}.secondary{background:#ecebea;color:#222}.status{font-size:13px;margin-top:15px;padding:10px;border-radius:9px;background:#eee}.ok{background:#e7f6ec;color:#176b35}.bad{background:#ffeded;color:#9b1c1c}.check{display:flex;align-items:center;gap:7px;margin-top:10px}.check label{margin:0;font-weight:500}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modal-card{width:min(760px,100%);background:#fff;border-radius:16px;padding:18px;box-shadow:0 20px 60px #0005}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}#yamlText{width:100%;height:420px;margin:12px 0;padding:12px;border:1px solid #ccc;border-radius:10px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}@media(max-width:850px){.app{grid-template-columns:1fr}.preview{height:auto;position:relative;order:-1}.controls{border-right:0}#qr{min-height:320px}}</style></head><body><div class="app"><section class="controls"><h1>QR Designer</h1><div class="sub">Live UI using the exact same Python renderer as the CLI.</div>
<label>URL / text</label><input id="value" type="url"><div class="row"><div><label>Error correction</label><select id="ec"><option>L</option><option>M</option><option>Q</option><option>H</option></select></div><div><label>Quiet zone</label><input id="quiet" type="number" min="0" max="10"></div></div>
<h2>Modules</h2><div class="row"><div><label>Shape</label><select id="moduleShape"><option>square</option><option>rounded</option><option>circle</option><option>diamond</option></select></div><div><label>Color</label><input id="moduleColor" type="color"></div></div><label>Module scale</label><div class="range"><input id="moduleScale" type="range" min=".35" max="1" step=".01"><span id="moduleScaleOut"></span></div><label>Roundness</label><div class="range"><input id="moduleRadius" type="range" min="0" max=".5" step=".01"><span id="moduleRadiusOut"></span></div>
<h2>Finder eyes</h2><div class="row"><div><label>Frame</label><select id="eyeFrame"><option>square</option><option>rounded</option><option>circle</option></select></div><div><label>Pupil</label><select id="eyePupil"><option>square</option><option>rounded</option><option>circle</option></select></div></div><div class="row"><div><label>Eye color</label><input id="eyeColor" type="color"></div><div><label>Pupil color</label><input id="pupilColor" type="color"></div></div><label>Eye roundness</label><div class="range"><input id="eyeRadius" type="range" min="0" max=".5" step=".01"><span id="eyeRadiusOut"></span></div>
<h2>Background</h2><label>Color</label><input id="bg" type="color"><h2>Logo</h2><div class="check"><input id="logoEnabled" type="checkbox"><label for="logoEnabled">Enable logo from YAML path</label></div><input id="logoPath" type="text" placeholder="assets/instagram.svg"><label>Logo scale</label><div class="range"><input id="logoScale" type="range" min=".05" max=".30" step=".01"><span id="logoScaleOut"></span></div><div class="check"><input id="knockout" type="checkbox"><label for="knockout">Background knockout behind logo</label></div>
<h2>Import / export</h2><div class="buttons"><button id="svgBtn">Download SVG</button><button id="pngBtn">Download PNG</button><button class="secondary" id="showYamlBtn">Show YAML</button><button class="secondary" id="yamlBtn">Download YAML</button><button class="secondary" id="jsonBtn">Download JSON</button><button class="secondary" id="loadBtn">Load YAML/JSON</button></div><input type="file" id="fileInput" accept=".yaml,.yml,.json" hidden><div id="status" class="status">Rendering…</div><p class="tiny">The rendered QR is automatically decoded server-side. Aggressive styling that breaks scanning shows a warning.</p></section><section class="preview"><div class="card"><div id="qr"></div></div></section></div><div id="yamlModal" class="modal"><div class="modal-card"><div class="modal-head"><h1>Current YAML</h1><button class="secondary" id="closeYaml">Close</button></div><textarea id="yamlText" spellcheck="false"></textarea><div class="buttons"><button id="copyYaml">Copy YAML</button><button class="secondary" id="downloadYamlModal">Download YAML</button></div></div></div>
<script>const $=x=>document.getElementById(x);let lastSvg='',timer;function spec(){return{value:$('value').value,error_correction:$('ec').value,quiet_zone:+$('quiet').value,module_size:12,modules:{shape:$('moduleShape').value,scale:+$('moduleScale').value,color:$('moduleColor').value,radius:+$('moduleRadius').value},eyes:{frame_shape:$('eyeFrame').value,pupil_shape:$('eyePupil').value,color:$('eyeColor').value,pupil_color:$('pupilColor').value,radius:+$('eyeRadius').value},background:{color:$('bg').value},logo:{enabled:$('logoEnabled').checked,path:$('logoPath').value||null,scale:+$('logoScale').value,knockout:$('knockout').checked,padding_modules:.65,radius_modules:.8},output:{validate:true}}}function outs(){$('moduleScaleOut').textContent=(+$('moduleScale').value).toFixed(2);$('moduleRadiusOut').textContent=(+$('moduleRadius').value).toFixed(2);$('eyeRadiusOut').textContent=(+$('eyeRadius').value).toFixed(2);$('logoScaleOut').textContent=(+$('logoScale').value).toFixed(2)}function set(s){$('value').value=s.value;$('ec').value=s.error_correction;$('quiet').value=s.quiet_zone;$('moduleShape').value=s.modules.shape;$('moduleScale').value=s.modules.scale;$('moduleColor').value=s.modules.color;$('moduleRadius').value=s.modules.radius;$('eyeFrame').value=s.eyes.frame_shape;$('eyePupil').value=s.eyes.pupil_shape;$('eyeColor').value=s.eyes.color;$('pupilColor').value=s.eyes.pupil_color||s.eyes.color;$('eyeRadius').value=s.eyes.radius;$('bg').value=s.background.color;$('logoEnabled').checked=s.logo.enabled;$('logoPath').value=s.logo.path||'';$('logoScale').value=s.logo.scale;$('knockout').checked=s.logo.knockout;outs()}async function render(){outs();let st=$('status');st.className='status';st.textContent='Rendering…';try{let r=await fetch('/api/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({spec:spec()})});let d=await r.json();if(!r.ok)throw Error(d.error);lastSvg=d.svg;$('qr').innerHTML=d.svg;st.textContent=(d.validation_ok?'✓ ':'⚠ ')+d.validation_message;st.className='status '+(d.validation_ok?'ok':'bad')}catch(e){st.textContent='Error: '+e.message;st.className='status bad'}}function queue(){clearTimeout(timer);timer=setTimeout(render,160)}function dl(n,b){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',queue));$('svgBtn').onclick=()=>dl('qr.svg',new Blob([lastSvg],{type:'image/svg+xml'}));$('pngBtn').onclick=async()=>{let r=await fetch('/api/png',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({spec:spec(),scale:4})});dl('qr.png',await r.blob())};$('jsonBtn').onclick=()=>dl('qr.json',new Blob([JSON.stringify(spec(),null,2)],{type:'application/json'}));async function currentYaml(){let d=await(await fetch('/api/yaml/dump',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({spec:spec()})})).json();return d.yaml}$('yamlBtn').onclick=async()=>dl('qr.yaml',new Blob([await currentYaml()],{type:'text/yaml'}));$('showYamlBtn').onclick=async()=>{$('yamlText').value=await currentYaml();$('yamlModal').classList.add('open')};$('closeYaml').onclick=()=>$('yamlModal').classList.remove('open');$('copyYaml').onclick=async()=>{await navigator.clipboard.writeText($('yamlText').value);$('copyYaml').textContent='Copied!';setTimeout(()=>$('copyYaml').textContent='Copy YAML',1000)};$('downloadYamlModal').onclick=()=>dl('qr.yaml',new Blob([$('yamlText').value],{type:'text/yaml'}));$('yamlModal').addEventListener('click',e=>{if(e.target===$('yamlModal'))$('yamlModal').classList.remove('open')});$('loadBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;let t=await f.text();if(f.name.endsWith('.json')){set(JSON.parse(t));render()}else{let r=await fetch('/api/yaml/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({yaml:t})});let d=await r.json();if(!r.ok)return alert(d.error);set(d.spec);render()}};fetch('/api/defaults').then(r=>r.json()).then(d=>{set(d);render()});</script></body></html>
